<title>Goal Grid</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* layout: one narrow column, one question per screen, a square 9x9 grid builds up as you answer. single look: black on white */
:root{
  --bg:#ffffff; --fg:#000000; --muted:#707070; --line:#000000; --soft:#e6e6e6; --chip:#f3f3f3;
  --accent:#e8322e;
  --narrow:"Arial Narrow","Archivo Narrow","Helvetica Neue",Arial,sans-serif;
  --script:"Mrs Saint Delafield","Snell Roundhand",cursive;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--narrow);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:block;height:48px;width:auto;max-width:100%;object-fit:contain}
.handle{color:var(--muted);font-size:14px}
.bar{height:2px;background:var(--soft)} .bar i{display:block;height:100%;background:var(--fg);width:0;transition:width .3s}
.step-label{color:var(--muted);font-size:14px;letter-spacing:.04em}
h1{font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.08;margin:0;text-wrap:balance;text-transform:lowercase}
h1 em{font-style:normal;color:var(--accent)}
.hint{color:var(--muted);margin:0;max-width:56ch}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:19px;color:var(--fg);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:10px 0;border-radius:0;outline:none;min-width:0}
input[type=text]:focus{border-bottom-color:var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.fields label{display:flex;gap:8px;align-items:baseline;min-width:0}
.fields label span{color:var(--muted);font-size:13px;width:14px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;background:var(--chip);color:var(--fg);border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--line)} .chip.used{opacity:.3;pointer-events:none}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font:inherit;font-size:14px;background:transparent;color:var(--fg);border:1px solid var(--line);padding:4px 10px;cursor:pointer;text-transform:lowercase}
.cat.on{background:var(--fg);color:var(--bg)}
.chips-title{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0}
.search{font-size:16px!important}
.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
button.main,button.ghost{font:inherit;font-size:17px;cursor:pointer;padding:12px 22px;border-radius:0}
button.main{background:var(--fg);color:var(--bg);border:1px solid var(--fg)}
button.ghost{background:transparent;color:var(--fg);border:1px solid transparent;padding-left:0}
button:focus-visible,.chip:focus-visible,.cat:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--accent);font-size:14px;min-height:1em;margin:0}
/* grid: one 9x9 css grid, square cells, thick lines between 3x3 blocks */
.grid-box{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));
  aspect-ratio:1/1;width:100%;max-width:100%;min-width:300px;box-sizing:border-box;border-top:2px solid var(--line);border-left:2px solid var(--line)}
.cell{box-sizing:border-box;min-width:0;min-height:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  font-size:clamp(6.5px,1.5vw,10.5px);line-height:1.1;padding:2px;word-break:break-word;hyphens:auto;text-transform:lowercase}
.cell.br{border-right:2px solid var(--line)} .cell.bb{border-bottom:2px solid var(--line)}
.cell.hub{color:var(--accent);font-size:clamp(7.5px,1.75vw,12.5px)}
.cell.goal{color:var(--accent);font-weight:600;font-size:clamp(8px,1.9vw,13.5px)}
.cell.now{background:var(--chip)}
/* rhythm */
.pillar-group{display:flex;flex-direction:column;gap:6px}
.pillar-group h3{margin:6px 0 2px;font-weight:500;color:var(--accent);text-transform:lowercase;font-size:18px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--soft);padding:4px 0}
.row .t{min-width:0;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--line)}
.seg button{font:inherit;font-size:13px;background:transparent;color:var(--fg);border:0;padding:5px 8px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg)}
.star{font:inherit;background:transparent;border:0;color:var(--fg);cursor:pointer;font-size:24px;line-height:1;padding:0 2px}
.star.on{color:var(--accent)}
/* plan */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan section{min-width:0}
.plan h3,.start h3{font-weight:500;margin:0 0 6px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plan ul,.start ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.plan li small{color:var(--muted)}
.start{border:1px solid var(--line);padding:16px}
.start ol{font-size:19px}
.closing{font-family:var(--script);font-size:38px;line-height:1;margin:0}
@media (max-width:560px){.fields{grid-template-columns:1fr}.plan{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AROUND=[0,1,2,3,5,6,7,8];

function cellText(b,c){
  if(b===4) return c===4?{t:S.goal,k:"goal"}:{t:S.pillars[AROUND.indexOf(c)],k:"hub"};
  const p=AROUND.indexOf(b); return c===4?{t:S.pillars[p],k:"hub",p}:{t:S.actions[p][AROUND.indexOf(c)],k:"",p};
}
function gridHTML(highlight){
  let h='<div class="grid-box"><div class="grid" role="img" aria-label="goal grid">';
  for(let r=0;r<9;r++) for(let col=0;col<9;col++){
    const b=Math.floor(r/3)*3+Math.floor(col/3), c=(r%3)*3+col%3, x=cellText(b,c);
    let cls="cell"; if(col%3===2) cls+=" br"; if(r%3===2) cls+=" bb"; if(x.k) cls+=" "+x.k; if(highlight!==undefined&&x.p===highlight) cls+=" now";
    h+=`<div class="${cls}">${esc(x.t||"")}</div>`;
  }
  return h+'</div></div>';
}
function chips(list,used,attr){
  const f=q.trim().toLowerCase(), shown=f?list.filter(x=>x.includes(f)):list;
  return '<div class="chips">'+(shown.map(x=>`<button class="chip${used.includes(x)?" used":""}" data-${attr}="${esc(x)}">${esc(x)}</button>`).join("")||'<span class="hint">nothing found. just type your own.</span>')+'</div>';
}
const searchBox=ph=>`<input type="text" class="search" id="q" placeholder="${ph}" value="${esc(q)}">`;
const nav=(next="next",back=true)=>`<p class="err" id="err"></p><div class="nav">${back?'<button class="ghost" id="back">← back</button>':'<span></span>'}<button class="main" id="next">${next}</button></div>`;

/* ---------- screens ---------- */
function render(focusSearch){
  $("#bar").style.width=(S.step/TOTAL*100)+"%";
  const st=S.step, el=$("#screen"); let h="";
  if(st===0){
    let g; if(S.goal){g=gridHTML()} else {const keep=S; S=Object.assign(fresh(),EXAMPLE); g=gridHTML(); S=keep;}
    h=`<h1>turn one big goal into <em>64 small actions</em></h1>
    <p class="hint">answer a few questions and your grid fills itself. at the end you get a clear plan: what to do every day, every week and every month, and the 3 things to start with tomorrow. takes about 15 minutes.</p>
    ${g}<p class="hint" style="font-size:14px">${S.goal?"your grid so far":"example grid"}</p>
    <div class="nav"><button class="ghost" id="example">try with the example</button><button class="main" id="next">${S.goal?"continue":"start"}</button></div>`;
  } else if(st===1){
    h=`<div class="step-label">step 1 of 4 · your goal</div>
    <h1>what do you want your life to look like?</h1>
    <p class="hint">one goal for the center. it can be big. write it the way you'd say it to a friend, or pick one below.</p>
    <input type="text" id="goal" maxlength="40" placeholder="e.g. my best self" value="${esc(S.goal)}">
    <div class="cats">${Object.keys(GOALS).map(k=>`<button class="cat${k===goalCat?" on":""}" data-cat="${k}">${k}</button>`).join("")}</div>
    ${chips(GOALS[goalCat],[S.goal],"goal")}${nav()}`;
  } else if(st===2){
    h=`<div class="step-label">step 2 of 4 · 8 areas</div>
    <h1>what does <em>${esc(S.goal)}</em> depend on?</h1>
    <p class="hint">name 8 areas of life that need to work for this goal to happen. tap to fill, or type your own.</p>
    <div class="fields">${S.pillars.map((p,i)=>`<label><span>${i+1}</span><input type="text" data-p="${i}" maxlength="18" value="${esc(p)}"></label>`).join("")}</div>
    <p class="chips-title">${PILLARS.length} areas to choose from</p>${searchBox("search areas")}${chips(PILLARS,S.pillars,"pill")}${nav()}`;
  } else if(st>=3&&st<=10){
    const p=st-3, name=S.pillars[p], key=name.toLowerCase().trim(), list=ACTIONS[key]||GENERIC;
    const all=[...new Set(Object.values(ACTIONS).flat())].filter(x=>!list.includes(x));
    h=`<div class="step-label">step 3 of 4 · area ${p+1} of 8</div>
    <h1><em>${esc(name)}</em>: 8 small actions</h1>
    <p class="hint">what would someone who already has this sorted do regularly? keep each one small and concrete.</p>
    <div class="fields">${S.actions[p].map((a,i)=>`<label><span>${i+1}</span><input type="text" data-a="${i}" maxlength="26" value="${esc(a)}"></label>`).join("")}</div>
    <p class="chips-title">${ACTIONS[key]?"ideas for "+esc(name):"ideas to adapt"}</p>${chips(list,S.actions[p],"act")}
    <details><summary class="chips-title" style="cursor:pointer">more ideas from other areas (${all.length})</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">${searchBox("search all actions")}${chips(all,S.actions[p],"act")}</div></details>
    ${gridHTML(p)}${nav(p===7?"see my grid":"next")}`;
  } else if(st===11){
    h=`<div class="step-label">step 4 of 4 · rhythm</div>
    <h1>how often will you do each one?</h1>
    <p class="hint">choose day, week or month. then star the <span style="color:var(--accent)">3 actions</span> you'll start with tomorrow: small, easy, no excuses.</p>`;
    S.pillars.forEach((pn,p)=>{
      h+=`<div class="pillar-group"><h3>${esc(pn)}</h3>`;
      S.actions[p].forEach((a,i)=>{const id=p+"-"+i,f=S.freq[id]||"week",on=S.stars.includes(id);
        h+=`<div class="row"><span class="t">${esc(a)}</span><div class="seg" role="group" aria-label="how often">${["day","week","month"].map(x=>`<button data-f="${id}" data-v="${x}" class="${f===x?"on":""}" aria-pressed="${f===x}">${x}</button>`).join("")}</div><button class="star${on?" on":""}" data-s="${id}" aria-label="start with this" aria-pressed="${on}">${on?"★":"☆"}</button></div>`;});
      h+=`</div>`;});
    h+=nav("build my plan");
  } else {
    const groups={day:[],week:[],month:[]};
    S.pillars.forEach((pn,p)=>S.actions[p].forEach((a,i)=>groups[S.freq[p+"-"+i]||"week"].push(`${esc(a)} <small>· ${esc(pn)}</small>`)));
    const starts=S.stars.map(id=>{const[p,i]=id.split("-").map(Number);return esc(S.actions[p][i])});
    h=`<h1>your plan for <em>${esc(S.goal)}</em></h1>
    <p class="hint">1 goal, 8 areas, 64 actions. screenshot it and keep it where you see it every day.</p>
    ${gridHTML()}
    <div class="start"><h3>start tomorrow with</h3><ol>${starts.map(s=>`<li>${s}</li>`).join("")}</ol></div>
    <div class="plan">${[["day","every day"],["week","every week"],["month","every month"]].map(([k,t])=>`<section><h3>${t} (${groups[k].length})</h3><ul>${groups[k].map(x=>`<li>${x}</li>`).join("")||"<li>nothing here</li>"}</ul></section>`).join("")}</div>
    <p class="closing">your map is ready. welcome to the club.</p>
    <div class="nav"><button class="ghost" id="back">← edit rhythm</button><button class="main" id="copy">copy my plan</button></div>
    <div class="nav"><button class="ghost" id="restart">start over</button><span class="err" id="err"></span></div>`;
  }
  el.innerHTML=h; bind(st);
  if(focusSearch){const s=$("#q"); if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);} }
  save();
}

function fillNext(arr,val){const i=arr.findIndex(x=>!x.trim()); if(i>=0) arr[i]=val;}
function err(t){const e=$("#err"); if(e) e.textContent=t;}
function go(n){S.step=n;q="";render();window.scrollTo(0,0);}
function bind(st){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);
  $("#back")&&($("#back").onclick=()=>go(Math.max(0,st-1)));
  $("#example")&&($("#example").onclick=()=>{S=Object.assign(fresh(),JSON.parse(JSON.stringify(EXAMPLE)));go(11);});
  $("#restart")&&($("#restart").onclick=()=>{S=fresh();go(0);});
  on("[data-cat]",b=>b.onclick=()=>{goalCat=b.dataset.cat;render();});
  on("[data-goal]",b=>b.onclick=()=>{S.goal=b.dataset.goal;render();});
  on("[data-pill]",b=>b.onclick=()=>{fillNext(S.pillars,b.dataset.pill);render();});
  on("[data-act]",b=>b.onclick=()=>{fillNext(S.actions[st-3],b.dataset.act);const d=document.querySelector("details");const open=d&&d.open;render();if(open)document.querySelector("details").open=true;});
  on("[data-p]",i=>i.oninput=()=>{S.pillars[+i.dataset.p]=i.value;save();});
  on("[data-a]",i=>i.oninput=()=>{S.actions[st-3][+i.dataset.a]=i.value;save();});
  $("#goal")&&($("#goal").oninput=e=>{S.goal=e.target.value;save();});
  $("#q")&&($("#q").oninput=e=>{q=e.target.value;const d=document.querySelector("details");const open=d&&d.open;render(true);if(open)document.querySelector("details").open=true;});
  on("[data-f]",b=>b.onclick=()=>{S.freq[b.dataset.f]=b.dataset.v;render();});
  on("[data-s]",b=>b.onclick=()=>{const id=b.dataset.s,i=S.stars.indexOf(id);
    if(i>=0)S.stars.splice(i,1); else if(S.stars.length<3)S.stars.push(id); else return err("you can star 3. unstar one first."); render();});
  $("#next")&&($("#next").onclick=()=>{
    if(st===1&&!S.goal.trim()) return err("write your goal or pick one.");
    if(st===2&&S.pillars.some(p=>!p.trim())) return err("fill all 8 areas.");
    if(st>=3&&st<=10&&S.actions[st-3].some(a=>!a.trim())) return err("fill all 8 actions.");
    if(st===11&&S.stars.length<3) return err("star 3 actions to start with.");
    go(st+1);
  });
  $("#copy")&&($("#copy").onclick=()=>{
    const g={day:[],week:[],month:[]};
    S.pillars.forEach((pn,p)=>S.actions[p].forEach((a,i)=>g[S.freq[p+"-"+i]||"week"].push(`- ${a} (${pn})`)));
    const starts=S.stars.map(id=>{const[p,i]=id.split("-").map(Number);return "- "+S.actions[p][i]});
    const txt=`my goal: ${S.goal}\n\nstart tomorrow with:\n${starts.join("\n")}\n\nevery day:\n${g.day.join("\n")}\n\nevery week:\n${g.week.join("\n")}\n\nevery month:\n${g.month.join("\n")}\n\nmade with @thewellnessforquitters`;
    navigator.clipboard.writeText(txt).then(()=>err("copied. paste it into your notes."),()=>err("couldn't copy here. take a screenshot of the plan instead."));
  });
}
render();
</script>

</body></html>
