<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>what's your energy type? · the wellness for quitters club</title>
<meta name="description" content="draw your energy, find your golden hours. a free 2-minute test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111; --soft:#8c8c8c; --line:#e7e7e7; --red:#d23a2f; --redsoft:rgba(210,58,47,.12); --chip:#f2f2f2;
    --font:"Geist",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{font-family:var(--font);color:var(--ink);text-transform:lowercase;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto;padding:22px 16px 64px;min-height:100vh;display:flex;flex-direction:column}

  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .logo{height:46px;width:auto;display:block}
  .handle{font-size:13px;color:var(--soft);padding-bottom:6px}
  @media (max-width:430px){ .handle{display:none} .logo{height:40px} }
  .bar{height:3px;background:var(--line);margin:14px 0 0;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0;transition:width .4s ease}

  .screen{flex:1;padding-top:30px;animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .step{font-size:14px;color:var(--soft);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .back{background:none;border:0;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-transform:lowercase;padding:4px 0}
  h1{font-size:42px;line-height:1.02;font-weight:500;letter-spacing:-.04em;margin-bottom:16px}
  h2{font-size:30px;line-height:1.05;font-weight:500;letter-spacing:-.03em;margin-bottom:22px}
  h3{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-bottom:10px}
  .red{color:var(--red)}
  p{font-size:17px;line-height:1.45;color:#555}
  .muted{color:var(--soft)}

  .opts{border-top:1px solid var(--ink)}
  .opt{display:block;width:100%;text-align:left;font:inherit;font-size:19px;background:none;border:0;border-bottom:1px solid var(--ink);
       padding:17px 0;color:var(--ink);cursor:pointer;text-transform:lowercase;transition:padding .15s,color .15s}
  .opt:hover{padding-left:8px;color:var(--red)}

  .btn{display:block;width:100%;margin-top:22px;padding:16px;font:inherit;font-size:17px;background:var(--ink);color:#fff;border:1px solid var(--ink);
       cursor:pointer;text-transform:lowercase;text-align:center}
  .btn:disabled{opacity:.3;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink)}
  .link{background:none;border:0;font:inherit;color:var(--soft);text-decoration:underline;cursor:pointer;margin-top:14px;font-size:15px;text-transform:lowercase}

  input[type=text],input[type=email]{width:100%;font:inherit;font-size:19px;border:0;border-bottom:1px solid var(--ink);padding:12px 0;outline:none;background:transparent;text-transform:lowercase;border-radius:0}
  input::placeholder{color:#b5b5b5}

  .slider{margin:8px 0 26px}
  .slider .row{display:flex;justify-content:space-between;align-items:baseline}
  .slider .val{font-size:40px;font-weight:500;letter-spacing:-.04em}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:2px;background:var(--ink);margin:16px 0 6px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:0}
  .scale{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}

  .draw{position:relative;border:1px solid var(--ink);touch-action:none;background:
        linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/25% 100%}
  canvas#pad{display:block;width:100%;height:260px;cursor:crosshair}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--soft);font-size:16px;transition:opacity .3s}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
  .two{display:grid;grid-template-columns:1fr 2fr;gap:8px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border-radius:999px;padding:8px 13px;font-size:14px}

  /* result */
  .block{padding:26px 0;border-top:1px solid var(--line)}
  .block:first-child{border-top:0;padding-top:0}
  .typename{font-size:56px;line-height:.95;font-weight:500;letter-spacing:-.05em;margin:6px 0 14px}
  .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink)}
  .fact{padding:14px 0;border-bottom:1px solid var(--ink)}
  .fact:nth-child(odd){padding-right:10px}
  .fact small{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
  .fact b{font-size:22px;font-weight:500;letter-spacing:-.02em}
  canvas#map{width:100%;height:220px;display:block;border-bottom:1px solid var(--ink)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:10px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
  .legend .g::before{background:var(--redsoft);border:1px solid var(--red)}
  .legend .d::before{background:#fff;border:1px dashed var(--ink);border-radius:50%}
  .use{border-top:1px solid var(--ink)}
  .use div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--ink);font-size:16px;line-height:1.35}
  .use b{font-weight:500}
  .soon{position:relative;border:1px solid var(--ink);padding:34px 20px 24px;margin-top:10px}
  .soon .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-size:13px;letter-spacing:.08em;color:var(--red);white-space:nowrap}
  .soon .st{position:absolute;font-size:14px;line-height:1;color:var(--ink);background:#fff;padding:2px}
  .soon .st.tl{top:-9px;left:-9px}.soon .st.tr{top:-9px;right:-9px}.soon .st.bl{bottom:-9px;left:-9px}.soon .st.br{bottom:-9px;right:-9px}
  .soon h3{font-size:26px;letter-spacing:-.03em;margin-bottom:8px}
  .soon ul{list-style:none;margin:18px 0 18px;border-top:1px solid var(--line)}
  .soon li{padding:11px 0 11px 22px;border-bottom:1px solid var(--line);font-size:16px;position:relative;line-height:1.35}
  .soon li::before{content:"✦";position:absolute;left:0;top:11px;color:var(--red);font-size:13px}
  .soon li .blur{filter:blur(4px);user-select:none;color:#777}
  .soon .early{font-size:14px;color:var(--soft);margin-top:4px}
  details{font-size:15px;color:#555;line-height:1.5}
  summary{cursor:pointer;color:var(--ink);font-size:16px;margin-bottom:8px}
  .banner{background:var(--chip);padding:12px 14px;font-size:15px;margin-top:18px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;font-size:15px;transition:all .3s;z-index:9;text-transform:lowercase}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .sheet{background:#fff;width:100%;max-width:400px;max-height:92vh;overflow:auto;padding:16px}
  .sheet img{display:block;width:100%;max-width:260px;margin:0 auto;border:1px solid var(--line)}
  .sheet .hint2{font-size:13px;color:var(--soft);text-align:center;margin-top:10px;line-height:1.4}
  .sheet .x{display:block;margin:10px auto 0;background:none;border:0;font:inherit;color:var(--soft);cursor:pointer;text-transform:lowercase}
  .foot{margin-top:40px;font-size:13px;color:var(--soft);display:flex;justify-content:space-between}
  .foot a{color:var(--soft)}
</style>
</head>

    <div class="handle">@thewellnessforquitters</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div id="app"></div>

<script>
/* ===== settings ===== */
const SITE = 'gridyourgoal.com/energy';
const SUBSTACK = 'https://substack.com/@thewellnessforquitters';

/* ===== questions =====  E early · M midday · L late · S sprinter · D steady */
const Q = [
  {q:'free day, no alarm. you wake up…', a:[
    ['before 8, my body just does that',{E:2}], ['around 10',{M:2}], ["after 12. don't judge",{L:2}]]},
  {q:'6am flight', a:[
    ['fine',{E:2}], ["i'll survive with coffee",{M:2}], ["i'd book the night one",{L:2}]]},
  {q:'your best ideas show up…', a:[
    ['in the morning shower',{E:2}], ['somewhere in the afternoon',{M:2}], ['in bed at 1am',{L:2}]]},
  {q:'11pm text: "come out?"', a:[
    ["i'm asleep",{E:2}], ['depends where',{M:2}], ['on my way',{L:2}]]},
  {q:'the worst part of your day', a:[
    ["the evening, i'm empty",{E:2}], ['3pm',{M:2}], ['the alarm',{L:2}]]},
  {q:'deadline in a week', a:[
    ['one crazy night',{S:2}], ['a bit every day',{D:2}]]},
  {q:'you can focus for…', a:[
    ["an hour or two, then i'm dead",{S:2}], ['hours, if no one texts me',{D:2}]]},
  {q:'a good day for you looks like', a:[
    ['nothing, nothing, then everything',{S:2}], ['the same pace all day',{D:2}]]},
  {type:'wake'},
  {type:'draw'}
];

/* ===== types ===== */
const TYPES = {
  ES:{name:'sunrise sprinter', line:'sharp at 7, done by 3.',
      about:"your brain is at its best before most people have opened their laptops. you work in short, intense bursts, and once they're used up, they're gone for the day. trying to be productive at night is a waste of your time."},
  ED:{name:'early builder', line:'up early, steady till late afternoon.',
      about:"you start early and keep a calm, even pace for hours. you don't need adrenaline to get things done, you need a routine and a quiet morning. your energy fades in the evening, so plan nothing important after dinner."},
  MS:{name:'midday sprinter', line:'slow start, unstoppable around noon.',
      about:"mornings are a warm-up for you. then somewhere around late morning you get a strong, focused burst where you can do a day's work in two hours. after that you need a real break, not more coffee."},
  MD:{name:'daylight builder', line:'even energy all day, gone by 10pm.',
      about:"your energy follows the sun: decent mornings, a long productive middle of the day, a soft landing in the evening. you're at your best with a normal schedule, and you fall apart a little without one."},
  LS:{name:'night sprinter', line:'useless till noon, brilliant after 9pm.',
      about:"you come alive when everyone else is winding down. your best work happens in late, intense sessions. forcing yourself into a 7am routine just makes you tired, it doesn't make you productive."},
  LD:{name:'slow burner', line:'warms up all day, peaks late.',
      about:"you need time to get going, but once you're in, you can focus for hours. your energy builds through the afternoon and stays high into the evening. you do your best work when nobody's interrupting you."}
};

/* ===== state ===== */
const S = {name:'', E:0, M:0, L:0, S:0, D:0, wd:7.5, we:9, curve:null};
let step = -1;
const HIST = [];
function apply(w){ add(w); HIST.push(w); }
function back(){ if(step<=0){ step=-1; HIST.length=0; Object.assign(S,{E:0,M:0,L:0,S:0,D:0}); render(); return; } const w=HIST.pop()||{}; for(const k in w) S[k]-=w[k]; step--; render(); window.scrollTo(0,0); }
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const friend = params.get('t') && TYPES[params.get('t')] ? {
  t: params.get('t'), n: params.get('n') || 'your friend', c: decodeCurve(params.get('c'))
} : null;

/* ===== helpers ===== */
function add(w){ for(const k in w) S[k]+=w[k]; }
function fmt(h){ h=((h%24)+24)%24; let H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H=(H+1)%24;M=0}
  return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0'); }
function half(h){ return Math.round(h*2)/2; }
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),2400); }
function setBar(){ const total=Q.length; const v = step<0?0:Math.min(1,(step)/total); document.getElementById('bar').style.width=(v*100)+'%'; }
function next(){ step++; render(); window.scrollTo(0,0); }
function encodeCurve(c){ return c.map(v=>Math.round(v*9)).join(''); }
function decodeCurve(s){ if(!s||s.length!==21) return null; return s.split('').map(d=>(+d)/9); }

/* ===== screens ===== */
function intro(){
  app.innerHTML = `<div class="screen">
    <div class="step">free · 2 minutes</div>
    <h1>what's your <span class="red">energy type?</span></h1>
    <p>answer 8 quick questions, draw how your energy moves during the day, and find your golden hours: the part of the day when your brain actually works.</p>
    <div class="chips" style="margin:22px 0 4px">${Object.values(TYPES).map(t=>`<span class="chip">${t.name}</span>`).join('')}</div>
    ${friend?`<div class="banner">${friend.n} is a <b>${TYPES[friend.t].name}</b>. take it and see when you're both at your best.</div>`:''}
    <input type="text" id="nm" placeholder="your first name (optional)" maxlength="18" style="margin-top:22px">
    <button class="btn" id="go">start</button>
  </div>`;
  document.getElementById('go').onclick=()=>{ S.name=document.getElementById('nm').value.trim(); next(); };
}

function render(){
  setBar();
  if(step<0) return intro();
  if(step>=Q.length) return result();
  const q=Q[step], n=`<div class="step"><button class="back" id="back">← back</button><span>${step+1} of ${Q.length}</span></div>`;

  if(q.type==='wake'){
    app.innerHTML = `<div class="screen">${n}
      <h2>when do you wake up?</h2>
      <div class="slider"><div class="row"><span class="muted">on weekdays</span><span class="val" id="wdv">${fmt(S.wd)}</span></div>
        <input type="range" id="wd" min="4.5" max="12" step=".25" value="${S.wd}"><div class="scale"><span>4:30</span><span>12:00</span></div></div>
      <div class="slider"><div class="row"><span class="muted">on weekends (be honest)</span><span class="val" id="wev">${fmt(S.we)}</span></div>
        <input type="range" id="we" min="4.5" max="14" step=".25" value="${S.we}"><div class="scale"><span>4:30</span><span>14:00</span></div></div>
      <button class="btn" id="ok">next</button></div>`;
    const a=document.getElementById('wd'), b=document.getElementById('we');
    a.oninput=()=>{S.wd=+a.value;document.getElementById('wdv').textContent=fmt(S.wd)};
    b.oninput=()=>{S.we=+b.value;document.getElementById('wev').textContent=fmt(S.we)};
    document.getElementById('ok').onclick=()=>{ if(S.we<=7.75) apply({E:1}); else if(S.we<=9.75) apply({M:1}); else apply({L:1}); next(); };
    bindBack(); return;
  }
  if(q.type==='draw'){
    app.innerHTML = `<div class="screen">${n}
      <h2>draw your energy on a normal day</h2>
      <div class="draw"><canvas id="pad"></canvas><div class="hint" id="hint">drag from left to right</div></div>
      <div class="ends"><span>6am</span><span>noon</span><span>6pm</span><span>midnight</span><span>2am</span></div>
      <p class="muted" style="font-size:14px;margin-top:10px">high = full energy, low = nothing left</p>
      <div class="two"><button class="btn ghost" id="clr">clear</button><button class="btn" id="ok" disabled>show my result</button></div></div>`;
    setupPad(); bindBack(); return;
  }
  app.innerHTML = `<div class="screen">${n}<h2>${q.q}</h2>
    <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}</div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ apply(q.a[+b.dataset.i][1]); next(); });
  bindBack();
}

function bindBack(){ const b=document.getElementById('back'); if(b) b.onclick=back; }

/* ===== draw pad ===== */
function setupPad(){
  const c=document.getElementById('pad'), ctx=c.getContext('2d'), dpr=window.devicePixelRatio||1;
  const W=c.clientWidth, H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; ctx.scale(dpr,dpr);
  let pts=[], drawing=false; const ok=document.getElementById('ok');
  const paint=()=>{ ctx.clearRect(0,0,W,H); if(pts.length<2) return;
    ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); pts.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke(); };
  const pos=e=>{ const r=c.getBoundingClientRect(); return {x:Math.max(0,Math.min(W,e.clientX-r.left)), y:Math.max(0,Math.min(H,e.clientY-r.top))}; };
  const check=()=>{ const span=pts.length?pts[pts.length-1].x-pts[0].x:0; ok.disabled = span < W*.6; };
  c.style.touchAction='none';
  c.addEventListener('pointerdown',e=>{ e.preventDefault(); try{c.setPointerCapture(e.pointerId)}catch(_){} drawing=true; pts=[pos(e)]; document.getElementById('hint').style.opacity=0; paint(); });
  c.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); if(p.x>=pts[pts.length-1].x-2) pts.push(p); paint(); check(); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>c.addEventListener(t,()=>{ drawing=false; check(); }));
  document.getElementById('clr').onclick=()=>{ pts=[]; paint(); ok.disabled=true; document.getElementById('hint').style.opacity=1; };
  ok.onclick=()=>{
    const s=[]; for(let i=0;i<=20;i++){ const x=W*i/20; let best=pts[0]; for(const p of pts) if(Math.abs(p.x-x)<Math.abs(best.x-x)) best=p; s.push(1-best.y/H); }
    // light smoothing
    S.curve = s.map((v,i)=> (v*2 + (s[i-1]??v) + (s[i+1]??v))/4 );
    const pi = S.curve.indexOf(Math.max(...S.curve)); const ph = 6+pi;
    const w = {}; w[ph<11?'E':(ph<17?'M':'L')] = 3;
    const mean = S.curve.reduce((a,b)=>a+b,0)/S.curve.length;
    w[Math.max(...S.curve)-mean > .32 ? 'S':'D'] = 1;
    apply(w);
    next();
  };
}

/* ===== analysis ===== */
function analyse(){
  const t = ['E','M','L'].sort((a,b)=>S[b]-S[a])[0];
  const st = S.S>S.D ? 'S' : (S.D>S.S ? 'D' : (S.curve && Math.max(...S.curve)-avg(S.curve)>.32 ? 'S':'D'));
  const key = t+st;
  const c = S.curve;
  const pi = c.indexOf(Math.max(...c)); const peak = 6+pi;
  const win = st==='S' ? 1 : 1.5;
  const g0 = half(peak-win), g1 = half(peak+win);
  // dip: lowest point between 11:00 and 20:00, away from the peak
  let di=-1, dv=9;
  for(let i=5;i<=14;i++){ if(Math.abs(i-pi)<3) continue; if(c[i]<dv){dv=c[i];di=i;} }
  const dip = di>=0 ? 6+di : null;
  // second wind: a later rise after the dip
  let sw=null;
  if(di>=0){ let bi=-1,bv=dv+.18; for(let i=di+2;i<=18;i++){ if(Math.abs(i-pi)<3) continue; if(c[i]>bv){bv=c[i];bi=i;} } if(bi>=0) sw=6+bi; }
  const lightsOut = S.wd + 16;
  const shutdown = lightsOut - 1;
  const jet = Math.abs(S.we - S.wd);
  return {key, T:TYPES[key], peak, g0, g1, dip, sw, shutdown, lightsOut, jet};
}
function avg(a){ return a.reduce((x,y)=>x+y,0)/a.length; }

function compareBlock(){
  if(!friend.c) return `<div class="block"><h3>you and ${friend.n}</h3><p>${friend.n} is a ${TYPES[friend.t].name}. you're a ${R.T.name}.</p></div>`;

  const h=6+bi;
  return `<div class="block"><h3>you and ${friend.n}</h3>
    <p>${friend.n} is a ${TYPES[friend.t].name}. your best time together is around <b class="red">${fmt(h)}</b>: that's when you both still have energy. plan the important talks, the gym or the big tasks for then.</p></div>`;
}

/* ===== energy map canvas ===== */
function drawMap(){
  const c=document.getElementById('map'), ctx=c.getContext('2d'), dpr=window.devicePixelRatio||1;
  const W=c.clientWidth, H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; ctx.scale(dpr,dpr);
  plot(ctx,W,H,S.curve,{golden:[R.g0,R.g1],dip:R.dip,friend:friend&&friend.c,lineW:3,font:13});
}
function plot(ctx,W,H,data,o){
  const pad=8, x=h=>pad+(W-2*pad)*(h-6)/20, xi=i=>pad+(W-2*pad)*i/20, y=v=>H-pad-(H-2*pad)*v;
  // grid
  ctx.strokeStyle='#eee'; ctx.lineWidth=1; for(let k=1;k<4;k++){ const gx=W*k/4; ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  // golden window
  if(o.golden){ ctx.fillStyle='rgba(210,58,47,.12)'; ctx.fillRect(x(o.golden[0]),0,x(o.golden[1])-x(o.golden[0]),H);
    ctx.strokeStyle='#d23a2f'; ctx.lineWidth=1; [o.golden[0],o.golden[1]].forEach(h=>{ctx.beginPath();ctx.moveTo(x(h),0);ctx.lineTo(x(h),H);ctx.stroke();}); }
  const line=(d,col,w,dash)=>{ ctx.setLineDash(dash||[]); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.beginPath();
    ctx.moveTo(xi(0),y(d[0])); for(let i=1;i<d.length;i++){ const xc=(xi(i-1)+xi(i))/2; ctx.quadraticCurveTo(xi(i-1),y(d[i-1]),xc,(y(d[i-1])+y(d[i]))/2); }
    ctx.lineTo(xi(d.length-1),y(d[d.length-1])); ctx.stroke(); ctx.setLineDash([]); };
  if(o.friend) line(o.friend,'#d23a2f',o.lineW-1,[6,6]);
  line(data,'#111',o.lineW);
  if(o.dip!==null && o.dip!==undefined){ const i=o.dip-6; ctx.fillStyle='#fff'; ctx.strokeStyle='#111'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(xi(i),y(data[i]),o.font*.55,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); }
}

/* ===== story card ===== */
async function buildCard(){
  try{ await document.fonts.load('500 120px Geist'); await document.fonts.load('400 40px Geist'); }catch(e){}
  const c=document.createElement('canvas'); c.width=1080; c.height=1920; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,1080,1920);
  const lg=document.querySelector('.logo'); if(lg && lg.complete){ const lh=120, lw=lg.naturalWidth*lh/lg.naturalHeight, k=Math.min(1,900/lw); x.drawImage(lg,90,95,lw*k,lh*k); }
  x.fillStyle='#111'; x.fillRect(90,240,900,6);
  x.textAlign='left'; x.font='400 40px Geist'; x.fillStyle='#8c8c8c'; x.fillText((S.name?S.name+"'s":'my')+' energy type',90,380);
  x.fillStyle='#111'; x.font='500 132px Geist';
  const words=R.T.name.split(' '); x.fillText(words[0],80,540); x.fillText(words.slice(1).join(' '),80,680);
  x.font='400 44px Geist'; x.fillText(R.T.line,90,780);
  x.save(); x.translate(90,880); plot(x,900,520,S.curve,{golden:[R.g0,R.g1],dip:R.dip,lineW:7,font:30}); x.restore();
  x.strokeStyle='#111'; x.lineWidth=3; x.beginPath(); x.moveTo(90,1400); x.lineTo(990,1400); x.stroke();
  x.fillStyle='#8c8c8c'; x.font='400 30px Geist'; x.fillText('6am',90,1450); x.textAlign='center'; x.fillText('noon',315,1450); x.fillText('6pm',540,1450); x.fillText('midnight',765,1450); x.textAlign='right'; x.fillText('2am',990,1450);
  x.textAlign='left'; x.font='400 38px Geist'; x.fillText('golden hours',90,1580);
  x.fillStyle='#d23a2f'; x.font='500 84px Geist'; x.fillText(fmt(R.g0)+'–'+fmt(R.g1),90,1680);
  x.fillStyle='#111'; x.font='400 36px Geist'; x.fillText('find yours · '+SITE,90,1830);
  const blob = await new Promise(r=>c.toBlob(r,'image/png'));
  R.cardBlob = blob;
  R.cardFile = new File([blob],'my-energy-type.png',{type:'image/png'});
  R.cardURL = URL.createObjectURL(blob);
}

function openCard(){
  if(!R.cardURL){ toast('one second…'); buildCard().then(openCard); return; }
  const canShare = !!(navigator.canShare && navigator.canShare({files:[R.cardFile]}));
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="sheet">
    <img src="${R.cardURL}" alt="your energy type card">
    ${canShare?`<button class="btn" id="shareCard">share or save</button>
      <p class="hint2">opens your phone's menu: instagram stories, save to photos, messages and more</p>`:''}
    <button class="btn ${canShare?'ghost':''}" id="dlCard">download</button>
    ${!canShare?'<p class="hint2">on a phone you can also press and hold the image to save it</p>':''}
    <button class="x" id="closeCard">close</button></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{ if(e.target===m) m.remove(); });
  m.querySelector('#closeCard').onclick=()=>m.remove();
  m.querySelector('#dlCard').onclick=()=>{ const a=document.createElement('a'); a.href=R.cardURL; a.download='my-energy-type.png'; document.body.appendChild(a); a.click(); a.remove(); };
  const sb=m.querySelector('#shareCard');
  if(sb) sb.onclick=()=>{ navigator.share({files:[R.cardFile], title:'my energy type', text:"i'm a "+R.T.name+'. find yours: '+SITE}).catch(()=>{}); };
}

/* ===== compare ===== */
function shareFriend(){
  const url = location.origin+location.pathname+'?t='+R.key+'&n='+encodeURIComponent(S.name||'')+'&c='+encodeCurve(S.curve);
  const text = "i'm a "+R.T.name+". what's your energy type?";
  if(navigator.share){ navigator.share({title:"what's your energy type?",text,url}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text+' '+url).then(()=>toast('link copied, send it to someone')); }
  else prompt('copy this link',url);
}

/* ===== waitlist (netlify forms) ===== */
async function joinWaitlist(){
  const em=document.getElementById('em').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em)) return toast('add a valid email');
  const body=new URLSearchParams({'form-name':'waitlist', email:em, type:R.T.name}).toString();
  try{
    const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!r.ok) throw 0;
    document.getElementById('join').textContent="you're on the list";
    document.getElementById('join').disabled=true;
    toast("you're on the list ✦");
  }catch(e){ toast('something went wrong, try again'); }
}

render();
